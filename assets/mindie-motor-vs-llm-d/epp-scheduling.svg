<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="430" viewBox="0 0 1028 430" role="img" aria-labelledby="title desc"><title id="title">llm-d EPP：插件化实例选点</title><desc id="desc">过滤、评分与最终选择解耦；实际插件顺序按配置而定；选择目标：缓存收益、排队与传输成本、会话和 SLO 综合权衡</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"><rect x="1" y="1" width="1026" height="428" rx="16" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.2"/><text x="30" y="41" font-size="26" font-weight="700" fill="#172b42" text-anchor="start">llm-d EPP：插件化实例选点</text><text x="30" y="66" font-size="14" font-weight="400" fill="#53657a" text-anchor="start">过滤、评分与最终选择解耦；实际插件顺序按配置而定</text><path d="M30 80 H998" stroke="#e4eaf1"/><rect x="210" y="105" width="608" height="52" rx="9" fill="#eff3f8" stroke="#64748b" stroke-width="1.2"/><text x="514" y="129" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">Request</text><text x="514" y="150" font-size="12" font-weight="400" fill="#53657a" text-anchor="middle">Prompt / Model / Priority</text><path d="M514 157 V175" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="210" y="175" width="608" height="52" rx="9" fill="#eff3f8" stroke="#64748b" stroke-width="1.2"/><text x="514" y="199" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">Filter</text><text x="514" y="220" font-size="12" font-weight="400" fill="#53657a" text-anchor="middle">健康状态 / P-D 角色</text><path d="M514 227 V245" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="210" y="245" width="608" height="52" rx="9" fill="#eaf1ff" stroke="#2563eb" stroke-width="1.2"/><text x="514" y="269" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">Scorer</text><text x="514" y="290" font-size="12" font-weight