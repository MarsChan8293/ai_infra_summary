<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="527" viewBox="0 0 1000 527" role="img" aria-labelledby="title desc"><title id="title">llm-d 多硬件抽象</title><desc id="desc">共享控制面与硬件接口</desc><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"><rect x="1" y="1" width="998" height="525" rx="14" fill="#fff" stroke="#dbe5ef"/><text x="28" y="39" font-size="24" font-weight="700" fill="#172b42" text-anchor="start">为什么 llm-d 能快速接入新芯片？</text><text x="28" y="63" font-size="14" font-weight="400" fill="#53657a" text-anchor="start">统一控制面 + 硬件专用 Overlay + 引擎 / Connector 复用</text><rect x="30" y="88" width="940" height="60" rx="8" fill="#eaf1ff" stroke="#9bb8f1"/><text x="500" y="111" font-size="16" font-weight="700" fill="#172b42" text-anchor="middle">共享控制面</text><text x="500" y="131" font-size="13" font-weight="400" fill="#53657a" text-anchor="middle">Gateway / EPP / InferencePool / KV Indexer / SLO</text><path d="M500 148 V169 M180 169 H820 M180 169 V185 M500 169 V185 M820 169 V185" fill="none" stroke="#64748b" stroke-width="2"/><rect x="30" y="185" width="300" height="61" rx="8" fill="#f2edfa" stroke="#b7a5e2"/><text x="180" y="208" font-size="16" font-weight="700" fill="#172b42" text-anchor="middle">资源与拓扑</text><text x="180" y="228" font-size="13" font-weight="400" fill="#53657a" text-anchor="middle">Device Plugin / DRA / NIC</text><rect x="350" y="185" width="300" height="61" rx="8" fill="#f2edfa" stroke="#b7a5e2"/><text x="500" y="208" font-size="16" font-weight="700" fill="#172b42" text-anchor="middle">引擎与部署</text><text x="500" y="228" font-size="13" font-weight="400" fill="#53657a" text-anchor="middle">容器 / TP-DP-EP / Kustomize</text><rect x="670" y="185" width="300" height="61" rx="8" fill="#f2edfa" stroke="#b7a5e2"/><text x="820" y="208" font-size="16" font-weight="700" fill="#172b42" text-anchor="middle">数据面及运行时</text><text x="820" y="228" font-size="13" font-weight="400" fill="#53657a" text-anchor="middle">Connector / KV Event / RAS</text><path d="M180 246 V266 H820 M500 246 V266 M820 246 V266 M500 266 V283" fill="none" stroke="#64748b" stroke-width="2"/><rect x="30" y="283" width="940" height="58" rx="8" fill="#e9f7ef" stroke="#93cbaa"/><text x="500" y="306" font-size="16" font-weight="700" fill="#172b42" text-anchor="middle">厂商专用适配层</text><text x="500" y="326" font-size="13" font-weight="400" fill="#53657a" text-anchor="middle">NVIDIA / AMD / TPU / 国产 GPU-NPU：独立镜像、协议与资源声明</text><rect x="30" y="362" width="940" height="128" rx="8" fill="#fff3df" stroke="#e0b675"/><text x="48" y="389" font-size="17" font-weight="700" fill="#172b42" text-anchor="start">不能仅靠换镜像解决的三个关键合同</text><text x="48" y="416" font-size="15" font-weight="400" fill="#172b42" text-anchor="start">1. KV 数据面：P/D 角色、传输参数、Rank、失败与释放语义</text><text x="48" y="442" font-size="15" font-weight="400" fill="#172b42" text-anchor="start">2. 缓存索引：tokenizer、hash、block 粒度、KV Event、replay</text><text x="48" y="468" font-size="15" font-weight="400" fill="#172b42" text-anchor="start">3. 生产治理：拓扑、设备故障、伸缩、权重冷启动与 SLO 校准</text><text x="30" y="511" font-size="12" font-weight="400" fill="#53657a" text-anchor="start">示意：控制面不直接执行芯片算子；适配成本由接口合同及数据面成熟度决定。</text></g></svg>
