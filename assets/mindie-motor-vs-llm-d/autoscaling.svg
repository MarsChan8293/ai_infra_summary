<svg xmlns="http://www.w3.org/2000/svg" width="1028" height="403" viewBox="0 0 1028 403" role="img" aria-labelledby="title desc"><title id="title">弹性伸缩：指标与 SLO 的闭环</title><desc id="desc">逻辑侧重点不同；控制器及阈值策略取决于版本；权重加载时间、冷缓存、P/D 容量不匹配和在途请求均应纳入伸缩决策</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"><rect x="1" y="1" width="1026" height="401" rx="16" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.2"/><text x="30" y="41" font-size="26" font-weight="700" fill="#172b42" text-anchor="start">弹性伸缩：指标与 SLO 的闭环</text><text x="30" y="66" font-size="14" font-weight="400" fill="#53657a" text-anchor="start">逻辑侧重点不同；控制器及阈值策略取决于版本</text><path d="M30 80 H998" stroke="#e4eaf1"/><text x="258" y="112" font-size="20" font-weight="700" fill="#172b42" text-anchor="middle">Motor</text><rect x="30" y="130" width="456" height="43" rx="9" fill="#eff3f8" stroke="#64748b" stroke-width="1.2"/><text x="258" y="157.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">Queue / TPS / KV 利用率</text><path d="M258 173 V189" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="30" y="189" width="456" height="43" rx="9" fill="#eaf1ff" stroke="#2563eb" stroke-width="1.2"/><text x="258" y="216.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">阈值判断 / P-D 配比建议</text><path d="M258 232 V248" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="30" y="248" width="456" height="43" rx="9" fill="#eff3f8" stroke="#64748b" stroke-width="1.2"/><text x="258" y="275.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">HPA / Infer Operator</text><path d="M258 291 V307" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="30" y="307" width="456" height="43" rx="9" fill="#e9f7ef" stroke="#15803d" stroke-width="1.2"/><text x="258" y="334.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">调整 P/D 实例</text><text x="750" y="112" font-size="20" font-weight="700" fill="#172b42" text-anchor="middle">llm-d</text><rect x="522" y="130" width="456" height="43" rx="9" fill="#eff3f8" stroke="#64748b" stroke-width="1.2"/><text x="750" y="157.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">TTFT / ITL / Queue</text><path d="M750 173 V189" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="522" y="189" width="456" height="43" rx="9" fill="#eaf1ff" stroke="#2563eb" stroke-width="1.2"/><text x="750" y="216.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">SLO 余量与容量估计</text><path d="M750 232 V248" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="522" y="248" width="456" height="43" rx="9" fill="#eff3f8" stroke="#64748b" stroke-width="1.2"/><text x="750" y="275.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">Autoscaler / K8s 控制器</text><path d="M750 291 V307" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" /><rect x="522" y="307" width="456" height="43" rx="9" fill="#e9f7ef" stroke="#15803d" stroke-width="1.2"/><text x="750" y="334.5" font-size="17" font-weight="650" fill="#172b42" text-anchor="middle">调整服务容量</text><path d="M30 364 H998" stroke="#e4eaf1"/><text x="30" y="387" font-size="12" font-weight="400" fill="#53657a" text-anchor="start">权重加载时间、冷缓存、P/D 容量不匹配和在途请求均应纳入伸缩决策</text></g></svg>
